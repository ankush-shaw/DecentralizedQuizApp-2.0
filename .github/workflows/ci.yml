name: Soroban CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          override: true

      - name: Ensure wasm target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.88.0

      - name: Add rust-src component
        run: rustup component add rust-src --toolchain 1.88.0

      - name: Cache Cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Contract Tests
        run: cargo test --manifest-path contracts/quiz-contract/Cargo.toml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.88.0
          targets: wasm32-unknown-unknown
          override: true

      - name: Ensure wasm target
        run: rustup target add wasm32-unknown-unknown --toolchain 1.88.0

      - name: Add rust-src component
        run: rustup component add rust-src --toolchain 1.88.0

      - name: Build Contract (WASM)
        run: |
          cd contracts/quiz-contract
          cargo build --target wasm32-unknown-unknown --release

      - name: Verify WASM exists
        run: ls -l target/wasm32-unknown-unknown/release/*.wasm

  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Type Check & Production Build
        run: npm run build

